<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111;color:#fff;font-family:monospace;display:grid;place-items:center;touch-action:none}
#app{width:min(96vw,520px);height:min(96vh,760px);display:flex;flex-direction:column;gap:10px}
#app h1{margin:0;text-align:center;font-size:20px;letter-spacing:2px}#intro{margin:-4px 0 0;text-align:center;color:#aaa;font-size:12px;line-height:1.3}#top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px;letter-spacing:1px}
#top span{padding:6px 9px;border:2px solid #555;background:#050505}
#game{display:block;width:100%;aspect-ratio:1;border:4px solid #777;background:#000;image-rendering:pixelated;box-shadow:0 0 0 2px #222}
#bar{display:flex;gap:7px;justify-content:center}
button{font:700 14px monospace;color:#fff;background:#181818;border:2px solid #777;padding:9px 12px;min-height:42px;cursor:pointer}
button:active{background:#444;transform:translateY(1px)}
#pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center}
#pad button{padding:0;font-size:20px}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#help{text-align:center;color:#aaa;font-size:12px;line-height:1.35}
@media(max-height:560px){#app{gap:5px;width:min(94vw,470px)}#app h1{font-size:16px}#intro{display:none}#pad{display:none}#help{display:none}}
</style>

<body>
<main id="app">
<h1>Pixel Snake</h1>
<p id="intro">Play a lightweight retro Snake game online. Use Arrow keys, WASD, or the touch controls.</p>
<div id="top"><span>SCORE <b id="score">0</b></span><span>HI <b id="hi">0</b></span></div>
<canvas id="game" width="320" height="320"></canvas>
<div id="bar"><button id="start">START</button><button id="pause">PAUSE</button><button id="mute">SOUND: ON</button></div>
<div id="pad">
<button id="up" aria-label="Up">▲</button><button id="left" aria-label="Left">◀</button>
<button id="down" aria-label="Down">▼</button><button id="right" aria-label="Right">▶</button>
</div>
<div id="help">ARROWS / WASD · SPACE = PAUSE · TAP D-PAD TO MOVE</div>
</div>
</main>
<noscript>JavaScript is required to play Pixel Snake.</noscript>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),x=c.getContext("2d"),S=document.getElementById("score"),H=document.getElementById("hi");
const W=20,T=16;let snake,food,dir,next,score,run=false,pause=false,timer,mute=false;
let hi=+localStorage.snakeHi||0;H.textContent=hi;
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function beep(f,d,type="square",v=.035){if(mute||!AC)return;ac||(ac=new AC);let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function sound(n){if(n==1)beep(760,.06);if(n==2){beep(190,.16,"sawtooth",.045);setTimeout(()=>beep(100,.2,"square",.03),70)}if(n==3)beep(300,.025)}
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=next={x:1,y:0};score=0;S.textContent=0;place();pause=false;run=true;clearInterval(timer);timer=setInterval(tick,105);draw()}
function place(){do{food={x:Math.random()*W|0,y:Math.random()*W|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function over(){run=false;clearInterval(timer);sound(2);draw();setTimeout(()=>{if(!run)overlay("GAME OVER","PRESS START")},20)}
function tick(){if(!run||pause)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.x>=W||h.y<0||h.y>=W||snake.some(p=>p.x==h.x&&p.y==h.y)){over();return}
snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;S.textContent=score;if(score>hi){hi=score;H.textContent=hi;localStorage.snakeHi=hi}sound(1);place()}else snake.pop();draw()}
function draw(){x.fillStyle="#000";x.fillRect(0,0,320,320);x.fillStyle="#111";for(let i=0;i<=W;i++){x.fillRect(i*T,0,1,320);x.fillRect(0,i*T,320,1)}
x.fillStyle="#fff";x.fillRect(food.x*T+3,food.y*T+3,10,10);
snake.forEach((p,i)=>{x.fillStyle=i?"#fff":"#ddd";x.fillRect(p.x*T+1,p.y*T+1,14,14);if(!i){x.fillStyle="#000";x.fillRect(p.x*T+5,p.y*T+4,2,2);x.fillRect(p.x*T+10,p.y*T+4,2,2)}})}
function overlay(a,b){x.fillStyle="rgba(0,0,0,.82)";x.fillRect(20,110,280,100);x.fillStyle="#fff";x.textAlign="center";x.font="bold 24px monospace";x.fillText(a,160,150);x.font="bold 13px monospace";x.fillText(b,160,180)}
function setdir(dx,dy){if(!run)return;if(dx!=-dir.x||dy!=-dir.y)next={x:dx,y:dy};sound(3)}
function toggle(){if(!run)return;pause=!pause;pauseBtn.textContent=pause?"RESUME":"PAUSE";draw();if(pause)overlay("PAUSED","SPACE / RESUME")}
const pauseBtn=document.getElementById("pause");
document.getElementById("start").onclick=()=>{sound(3);reset()};
pauseBtn.onclick=()=>{sound(3);toggle()};
document.getElementById("mute").onclick=e=>{mute=!mute;e.currentTarget.textContent="SOUND: "+(mute?"OFF":"ON");if(!mute)sound(3)};
document.addEventListener("keydown",e=>{let k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m){e.preventDefault();setdir(...m)}if(k==" "){e.preventDefault();toggle()}if(k=="enter"&&!run)reset()});
[["up",0,-1],["down",0,1],["left",-1,0],["right",1,0]].forEach(a=>document.getElementById(a[0]).addEventListener("pointerdown",e=>{e.preventDefault();setdir(a[1],a[2])}));
snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=next={x:1,y:0};score=0;place();draw();overlay("PIXEL SNAKE","PRESS START");
})();
</script>
</body>
</html>
